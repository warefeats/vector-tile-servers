services:
  engine:
    image: pramsey/pg_tileserv:20250131
    command: ["--config", "/config/pg_tileserv.toml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db/bench
      GOMAXPROCS: "4"
    volumes:
      - ../configs/pg_tileserv:/config:ro
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8099}:7800"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: vts
    external: true
