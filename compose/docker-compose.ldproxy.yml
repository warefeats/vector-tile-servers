services:
  engine:
    image: iide/ldproxy:4.8.1
    environment:
      # The JVM defaults to a heap of 25% of container memory; let it use the same 4 GB the others get.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    volumes:
      - ../configs/ldproxy/cfg.yml:/ldproxy/data/cfg.yml:ro
      - ../configs/ldproxy/entities:/ldproxy/data/entities:ro
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8099}:7080"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: vts
    external: true
